spring.application.name=AIPCBuilder

# Server Configuration
server.port=8080

# Ollama Configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.1:8b
spring.ai.ollama.chat.options.temperature=0.0
spring.ai.ollama.chat.options.top-p=1.0
spring.ai.ollama.chat.options.num-ctx=4096

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/pcbuilder
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true