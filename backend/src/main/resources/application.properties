spring.application.name=AIPCBuilder

# Server Configuration
server.port=8080

# Add Bedrock configuration
spring.ai.bedrock.aws.region=us-east-1
spring.ai.bedrock.converse.chat.enabled=true
spring.ai.bedrock.converse.chat.options.model=us.meta.llama3-1-8b-instruct-v1:0
spring.ai.bedrock.converse.chat.options.temperature=0.0
spring.ai.bedrock.converse.chat.options.top-p=1.0
spring.ai.bedrock.converse.chat.options.max-tokens=4096

# PostgreSQL Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Spring Boot Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never