<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join PC Builder AI to start building your perfect PC</p>
    </div>

    <form (ngSubmit)="onSignup()" class="auth-form">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="signupData.username"
          class="form-input"
          placeholder="Choose a username"
          required
          minlength="3"
          [disabled]="isLoading">
        <div class="form-hint">Must be at least 3 characters long</div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="signupData.password"
          class="form-input"
          placeholder="Create a password"
          required
          minlength="3"
          [disabled]="isLoading">
        <div class="form-hint">Must be at least 3 characters long</div>
      </div>

      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          [(ngModel)]="signupData.confirmPassword"
          class="form-input"
          placeholder="Confirm your password"
          required
          [disabled]="isLoading">
      </div>

      @if (errorMessage) {
        <div class="error-message">
          {{ errorMessage }}
        </div>
      }

      <button
        type="submit"
        class="btn btn-primary btn-full"
        [disabled]="isLoading">
        @if (!isLoading) {
          <span>Create Account</span>
        }
        @if (isLoading) {
          <span>Creating Account...</span>
        }
      </button>
    </form>

    <div class="auth-footer">
      <p class="auth-link-text">
        Already have an account? 
        <a (click)="navigateToLogin()" class="auth-link">Sign in here</a>
      </p>
      <a (click)="navigateToHome()" class="back-link">← Back to Home</a>
    </div>
  </div>
</div>
